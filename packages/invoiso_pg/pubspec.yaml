name: invoiso_pg
description: Postgres adapter for invoiso_core — runs the existing sqflite-based services against Postgres (one schema per company).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  invoiso_core:
    path: ../invoiso_core
  meta: ^1.16.0
  postgres: ^3.4.0
  sqflite_common: ^2.5.6
  sqflite_common_ffi: ^2.3.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
